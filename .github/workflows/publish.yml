name: Publish Maven
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/setup-gradle
      - name: Publish to MineVN Maven repo
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :minevnlib-plugin:publishMavenJavaPublicationToMinevnRepository
